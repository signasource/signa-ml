# Configuración del modelo de señas ESTÁTICAS (abecedario LSA).
#
# Es un pipeline aparte del de señas dinámicas (signs_config.yaml):
#   - entrada: una sola imagen / un solo frame (no secuencias)
#   - features: landmarks de MANO (MediaPipe Hands), no Holistic
#   - modelo: MLP densa → models/exports/signa_alphabet_vX.tflite
#
# Las imágenes crudas viven en data/raw/abc/<cualquier subcarpeta>/LSA_<LETRA>_<FUENTE>.png
# donde <FUENTE> es el id del video del que se sacó el screenshot (ver Tracker en Drive).
# Ese id es el que se usa para agrupar el split: así el test set nunca comparte
# señante con el train set y la accuracy reportada es honesta.

# Letras objetivo. "Z" queda afuera: en LSA es dinámica y el Tracker la marca
# FALSE en las 15 fuentes (no hay fotos). Agregala acá si algún día hay datos.
letters:
  - A
  - B
  - C
  - D
  - E
  - F
  - G
  - H
  - I
  - J
  - K
  - L
  - M
  - N
  - Ñ
  - O
  - P
  - Q
  - R
  - S
  - T
  - U
  - V
  - W
  - X
  - Y

# Extracción de landmarks con MediaPipe Hands
extraction:
  static_image_mode: true       # cada foto es independiente, no hay tracking
  max_num_hands: 2              # detecta 2 y nos quedamos con la de mayor score
  model_complexity: 1           # 1 = modelo pesado/preciso (vale la pena offline)
  min_detection_confidence: 0.3 # bajo a propósito: preferimos recuperar fotos
                                # difíciles y filtrar después por score
  mirror_left_to_right: true    # espeja las manos izquierdas para que el modelo
                                # sea agnóstico a la mano dominante

  # Aumentación a NIVEL IMAGEN (antes de MediaPipe). Cada variante se vuelve a
  # pasar por el detector, así el dataset incluye el ruido real del detector
  # ante rotaciones/iluminación distintas — que es la fuente de error nº1 en vivo.
  augment:
    enabled: true
    variants_per_image: 6       # copias aumentadas por foto original
    rotation_deg: 12            # ± grados
    scale: [0.85, 1.15]
    translate_frac: 0.06        # ± fracción del lado de la imagen
    brightness: [0.7, 1.3]
    contrast: [0.8, 1.2]
    blur_prob: 0.25             # simula webcam fuera de foco
    jpeg_prob: 0.25             # simula compresión de webcam

# Entrenamiento
training:
  # "group": agrupa por id de fuente (leave-sources-out). Es el número honesto.
  # "random": split estratificado clásico. Infla la accuracy porque la misma
  #           foto aumentada puede caer en train y test — sirve solo de sanity check.
  split: group
  test_sources: 3               # cuántas fuentes se reservan para test
  val_sources: 2                # cuántas fuentes se reservan para validación
  epochs: 300
  batch_size: 64
  # Cuántas redes se entrenan con semillas distintas y se promedian. Con estos
  # datos, 5 redes suben ~2 puntos y bajan la varianza entre folds respecto de
  # una sola. El .tflite queda ~5x más grande (≈6 MB) pero sigue siendo chico
  # para móvil. Poné 1 si necesitás el modelo mínimo.
  ensemble: 5
  learning_rate: 0.001
  label_smoothing: 0.05
  dropout: 0.35
  hidden_units: [512, 256, 128]
  # Aumentación a NIVEL LANDMARK (en cada batch, sobre las features ya extraídas)
  landmark_noise_std: 0.012
  min_hand_score: 0.5           # descarta detecciones por debajo de este score

# Inferencia en vivo
inference:
  threshold: 0.75               # confianza mínima para mostrar una letra
  confirm_frames: 5             # frames consecutivos coincidentes para confirmar
  smoothing_window: 7           # promedio móvil de probabilidades (anti-parpadeo)
